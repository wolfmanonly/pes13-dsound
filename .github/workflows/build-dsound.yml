name: build-dsound

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex pkg-config libtool libtool-bin autoconf gettext libxml2-dev

      - name: Clone FEXTendo v0.4.2
        run: |
          git clone --depth 1 --branch v0.4.2 https://github.com/Ibnuard/pes13_nx.git port

      - name: Fetch LLVM-Mingw 20260505
        run: |
          mkdir -p "$HOME/.cache/pes13-nx/toolchains"
          curl -fL -o /tmp/llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260505/llvm-mingw-20260505-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xJf /tmp/llvm-mingw.tar.xz -C "$HOME/.cache/pes13-nx/toolchains"

      - name: Bootstrap Wine-NX source
        env:
          PES_BUILD_ROOT: ${{ github.workspace }}/build
        run: |
          mkdir -p "$PES_BUILD_ROOT"
          cd port
          bash tools/bootstrap-wsl.sh

      - name: Build dsound.dll
        env:
          PES_BUILD_ROOT: ${{ github.workspace }}/build
        run: |
          cd port
          bash tools/build-pe-wsl.sh dsound.dll
          ls -l "$PES_BUILD_ROOT/extra-dlls/dsound.dll"

      - name: Upload dsound.dll
        uses: actions/upload-artifact@v4
        with:
          name: dsound-dll
          path: ${{ github.workspace }}/build/extra-dlls/dsound.dll
          if-no-files-found: error

      - name: Upload dsound source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsound-source
          path: |
            ${{ github.workspace }}/build/source/dlls/dsound
            ${{ github.workspace }}/build/runtime-pes13-source/dlls/dsound
          if-no-files-found: warn
